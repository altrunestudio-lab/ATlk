<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ATlk — Render Set</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--paper:#fff;--ink:#1c1b19;--soft:#5b574e;--line:#ddd9d0;--tan:#7a5c3e;--light:#f5f4f1}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Space Grotesk',Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}h1,h2,.serif{font-family:'Fraunces',Georgia,serif}a{color:inherit}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 28px;flex-wrap:wrap}
.brand{font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:600;white-space:nowrap}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn,.frame button,.lightbox button{border:1px solid var(--ink);background:white;color:var(--ink);border-radius:2px;padding:9px 13px;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.btn:hover,.frame button:hover,.lightbox button:hover{background:var(--ink);color:white}.btn.primary{background:var(--ink);color:white}.btn.primary:hover{background:var(--tan);border-color:var(--tan)}
.hero{max-width:1456px;margin:auto;padding:76px 190px 62px 28px;position:relative}.architect-logo{position:absolute;right:28px;top:28px;width:132px;height:132px;object-fit:contain}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--tan);margin:0 0 22px}.hero h1{font-size:clamp(76px,13vw,180px);font-weight:400;letter-spacing:-.07em;line-height:.85;margin:0 0 32px}.hero p:last-child{max-width:670px;color:var(--soft);font-size:clamp(16px,2vw,21px);line-height:1.55;margin:0}
.gallery-wrap{border-top:1px solid var(--line);padding:48px 28px 90px}.gallery-intro{max-width:1400px;margin:0 auto 25px;display:flex;justify-content:space-between;align-items:baseline;gap:20px}.gallery-intro h2{font-size:clamp(30px,5vw,50px);font-weight:400;margin:0}.count{color:var(--soft);font-size:13px}.gallery{max-width:1400px;margin:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.frame{min-width:0;position:relative}.frame:first-child{grid-column:1/-1}.image-wrap{position:relative;overflow:hidden;background:var(--light);aspect-ratio:16/9;cursor:zoom-in}.frame:first-child .image-wrap{aspect-ratio:2/1}.image-wrap img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .3s}.image-wrap:hover img{transform:scale(1.015)}.cap{padding:13px 0 5px;color:var(--soft);font-size:13px;line-height:1.4}.frame-tools{display:flex;gap:5px;position:absolute;top:12px;right:12px;z-index:2;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 24px)}.frame button{background:rgba(255,255,255,.96);padding:6px 8px;font-size:10px}.frame button:disabled{opacity:.45;cursor:default}.empty{grid-column:1/-1;text-align:center;padding:80px 20px;border:1px dashed var(--line);color:var(--soft)}
.add-tile{border:1px dashed var(--line);background:var(--light);min-height:250px;cursor:pointer;color:var(--tan);font-size:14px}.add-tile:hover{border-color:var(--tan)}
footer{border-top:1px solid var(--line);padding:35px 28px;display:flex;align-items:end;justify-content:space-between;gap:15px;color:var(--soft);font-size:12px}footer .mark{font-family:'Fraunces',Georgia,serif;font-size:36px;color:var(--ink)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(18,18,17,.96);display:none;align-items:center;justify-content:center;flex-direction:column;padding:60px 70px 45px;color:white}.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:100%;object-fit:contain;min-height:0}.lightbox .lb-caption{padding:18px 0 0;text-align:center;font-size:13px}.lightbox button{position:absolute;background:rgba(255,255,255,.9)}.lightbox .close{right:20px;top:18px}.lightbox .prev{left:18px;top:50%}.lightbox .next{right:18px;top:50%}
.edit [contenteditable=true]{outline:1px dashed var(--tan);outline-offset:4px;background:rgba(122,92,62,.05);border-radius:2px}.edit [contenteditable=true]:focus{background:#fff8e9}.edit .cap{cursor:text}.edit .image-wrap{cursor:zoom-in}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:10px 16px;font-size:12px;z-index:80;display:none}.toast.show{display:block}
@media(max-width:800px){.gallery{grid-template-columns:1fr}.frame:first-child{grid-column:auto}.frame:first-child .image-wrap{aspect-ratio:16/9}.hero{padding-top:58px}.gallery-wrap{padding-top:38px}.lightbox{padding:60px 15px 50px}.lightbox .prev{left:6px}.lightbox .next{right:6px}}
@media(max-width:600px){.architect-logo{right:16px;top:16px;width:80px;height:80px}.topbar{padding:11px 16px}.hero,.gallery-wrap{padding-left:16px;padding-right:16px}.frame-tools{position:static;max-width:none;justify-content:flex-start;padding:7px 0 0}.gallery-intro{align-items:end}footer{padding:30px 16px}.hero{padding-right:108px}}
@media print{.topbar,.frame-tools,.add-tile,.lightbox{display:none!important}.gallery{display:block}.frame{break-inside:avoid;margin-bottom:16px}.hero{padding-top:20px}}
</style></head><body><section class="hero"><img class="architect-logo" src="2 Architects logo.jpg" alt="2 Architects logo"><p class="eyebrow">2Architects · Render set</p><h1>ATlk</h1><p>A collection of renders for the ATlk project.</p></section><main class="gallery-wrap"><div class="gallery-intro"><h2>Renders</h2><span class="count">12 images</span></div><div class="gallery"><article class="frame"><div class="image-wrap"><img src="images/render-01.png" alt="Render 01" loading="lazy"></div><div class="cap">Render 01</div></article><article class="frame"><div class="image-wrap"><img src="images/render-02.png" alt="Render 02" loading="lazy"></div><div class="cap">Render 02</div></article><article class="frame"><div class="image-wrap"><img src="images/render-03.png" alt="Render 03" loading="lazy"></div><div class="cap">Render 03</div></article><article class="frame"><div class="image-wrap"><img src="images/render-04.png" alt="Render 04" loading="lazy"></div><div class="cap">Render 04</div></article><article class="frame"><div class="image-wrap"><img src="images/render-05.png" alt="Render 05" loading="lazy"></div><div class="cap">Render 05</div></article><article class="frame"><div class="image-wrap"><img src="images/render-07.png" alt="Render 06" loading="lazy"></div><div class="cap">Render 06</div></article><article class="frame"><div class="image-wrap"><img src="images/render-08.png" alt="Render 07" loading="lazy"></div><div class="cap">Render 07</div></article><article class="frame"><div class="image-wrap"><img src="images/render-09.png" alt="Render 08" loading="lazy"></div><div class="cap">Render 08</div></article><article class="frame"><div class="image-wrap"><img src="images/render-10.png" alt="Render 09" loading="lazy"></div><div class="cap">Render 09</div></article><article class="frame"><div class="image-wrap"><img src="images/render-11.png" alt="Render 10" loading="lazy"></div><div class="cap">Render 10</div></article><article class="frame"><div class="image-wrap"><img src="images/render-12.png" alt="Render 11" loading="lazy"></div><div class="cap">Render 11</div></article><article class="frame"><div class="image-wrap"><img src="images/render-14.png" alt="Render 12" loading="lazy"></div><div class="cap">Render 12</div></article></div></main><footer><div class="mark">ATlk</div><div>2Architects · 2026</div></footer><div class="lightbox"><button class="close">Close</button><button class="prev" aria-label="Previous render">‹</button><img alt="Expanded render"><button class="next" aria-label="Next render">›</button><div class="lb-caption"></div></div><script>
(()=>{const lb=document.querySelector('.lightbox'),img=lb.querySelector('img'),cap=lb.querySelector('.lb-caption');let at=0;const frames=()=>[...document.querySelectorAll('.frame')];function open(i){let all=frames();if(!all.length)return;at=(i+all.length)%all.length;img.src=all[at].querySelector('img').src;cap.textContent=all[at].querySelector('.cap').textContent;lb.classList.add('open')}function close(){lb.classList.remove('open');img.removeAttribute('src')}
document.querySelector('.gallery').addEventListener('click',e=>{if(e.target.closest('button'))return;let f=e.target.closest('.frame');if(f)open(frames().indexOf(f))});lb.querySelector('.close').onclick=close;lb.querySelector('.prev').onclick=()=>open(at-1);lb.querySelector('.next').onclick=()=>open(at+1);lb.addEventListener('click',e=>{if(e.target===lb)close()});document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')open(at-1);if(e.key==='ArrowRight')open(at+1)})})();
</script></body></html>
